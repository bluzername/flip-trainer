# XcodeGen spec. Generate the project with:
#   brew install xcodegen && cd ios-app && xcodegen generate
#
# The .xcodeproj is deliberately NOT committed: a pbxproj is unreviewable in diffs and
# merge-hostile. This file is the source of truth. See ADR-0006.
name: FlipTrainer
options:
  bundleIdPrefix: com.fliptrainer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: "1.28.2"

targets:
  FlipTrainer:
    type: application
    platform: iOS
    sources:
      - path: FlipTrainer
    dependencies:
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fliptrainer.controller
        INFOPLIST_FILE: FlipTrainer/Info.plist
        TARGETED_DEVICE_FAMILY: "1"

  FlipTrainerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlipTrainerTests
    dependencies:
      - target: FlipTrainer

schemes:
  FlipTrainer:
    build:
      targets:
        FlipTrainer: all
        FlipTrainerTests: [test]
    test:
      targets:
        - FlipTrainerTests
    run:
      config: Debug
